name: 功能建议
description: 提出一个新的功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**要解决的问题**，而不是直接给出方案。这样更容易判断该怎么实现。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的不便
      description: 现在做这件事需要几步？哪里别扭？
      placeholder: 每次记录训练都要重新填一遍重量，即使上周是同样的重量。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么改
      description: 有具体想法就写，没有也可以只描述期望效果
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 首页（K 线 / 摄入进度）
        - 记录体重或饮食
        - 营养计划
        - 训练计划
        - 「我」页面与设置
        - 数据备份与恢复
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: rules
    attributes:
      label: 确认
      options:
        - label: 该建议不改变现有的热量与宏量计算规则（若需改变，请说明理由）
          required: false
        - label: 该建议不破坏现有备份文件格式的兼容性
          required: false
