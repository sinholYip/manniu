version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      androidx-compose:
        patterns:
          - "androidx.compose*"
      androidx-other:
        patterns:
          - "androidx.*"
          - "!androidx.compose*"
      test-libs:
        patterns:
          - "junit*"
          - "org.robolectric*"
          - "androidx.test*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - dependencies
